      .line { stroke: #FFFFFF; stroke-opacity: 0.38; stroke-width: 2; }
      .thin { stroke: #FFFFFF; stroke-opacity: 0.2; stroke-width: 1; }
      .route { stroke: #FFFFFF; stroke-opacity: 0.32; stroke-width: 2; stroke-dasharray: 7 9; }
      .card { fill: #061A3D; fill-opacity: 0.78; stroke: url(#cardStroke); stroke-width: 1.5; }
      .chip { fill: #EF0107; fill-opacity: 0.92; }
      .small { fill: #DDE7F6; font-size: 18px; font-weight: 650; letter-spacing: 0; }
      .label { fill: #FFFFFF; font-size: 22px; font-weight: 800; letter-spacing: 0; }
      .body { fill: #F8FAFC; font-size: 17px; font-weight: 560; letter-spacing: 0; }
      .micro { fill: #BFD0EA; font-size: 14px; font-weight: 700; letter-spacing: 0; }
