<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu football-inspired developer profile</title>
  <desc id="desc">A cinematic horizontal player profile with a perspective football pitch, a correctly constructed goal, and a ball rolling toward the net.</desc>
  <defs>
    <linearGradient id="stadium" x1="40" y1="18" x2="1128" y2="532" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101915"/>
      <stop offset="0.48" stop-color="#13271D"/>
      <stop offset="1" stop-color="#07110C"/>
    </linearGradient>
    <linearGradient id="pitch" x1="890" y1="144" x2="876" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D8A5F"/>
      <stop offset="0.5" stop-color="#21683E"/>
      <stop offset="1" stop-color="#0B492B"/>
    </linearGradient>
    <radialGradient id="ball" cx="0" cy="0" r="1" gradientTransform="translate(-9 -12) rotate(48) scale(39)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#E9EBE8"/>
      <stop offset="1" stop-color="#9DA49F"/>
    </radialGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="net" width="12" height="10" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)">
      <path d="M0 0H12M0 0V10" stroke="#E9F2EC" stroke-opacity="0.34" stroke-width="0.8"/>
    </pattern>
    <clipPath id="pitchClip">
      <path d="M685 142H1032L1170 492H568L685 142Z"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="ballShadow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .sans { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-stretch: condensed; }
      .micro { fill: #D9E2DD; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .label { fill: #9FB0A7; font-size: 12px; font-weight: 600; }
      .value { fill: #FFFFFF; font-size: 16px; font-weight: 700; }
      .pitch-line { fill: none; stroke: #F5FAF6; stroke-width: 2; stroke-opacity: 0.7; }
      .route { fill: none; stroke: #E8D495; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 12; animation: route 2.8s linear infinite; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes route { to { stroke-dashoffset: -32; } }
      @keyframes sweep { 0%, 12% { transform: translateX(-260px); opacity: 0; } 38% { opacity: 0.2; } 66%, 100% { transform: translateX(760px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .route, .sweep { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="540" rx="24" fill="url(#stadium)"/>
  <path d="M0 430C249 362 415 377 604 430C781 480 986 487 1200 421V540H0V430Z" fill="#06100B" fill-opacity="0.72"/>
  <ellipse cx="894" cy="487" rx="334" ry="41" fill="#020805" fill-opacity="0.58" filter="url(#softShadow)"/>

  <g opacity="0.34">
    <circle cx="721" cy="60" r="2" fill="#FFFFFF"/><circle cx="751" cy="70" r="1.5" fill="#FFFFFF"/>
    <circle cx="789" cy="53" r="2" fill="#FFFFFF"/><circle cx="832" cy="68" r="1.5" fill="#FFFFFF"/>
    <circle cx="874" cy="49" r="2" fill="#FFFFFF"/><circle cx="919" cy="64" r="1.5" fill="#FFFFFF"/>
    <circle cx="964" cy="51" r="2" fill="#FFFFFF"/><circle cx="1009" cy="70" r="1.5" fill="#FFFFFF"/>
    <circle cx="1051" cy="55" r="2" fill="#FFFFFF"/><circle cx="1093" cy="68" r="1.5" fill="#FFFFFF"/>
  </g>

  <g class="sweep" clip-path="url(#pitchClip)">
    <path d="M500 86H640L912 540H742L500 86Z" fill="url(#glow)"/>
  </g>

  <path d="M685 142H1032L1170 492H568L685 142Z" fill="url(#pitch)"/>
  <g clip-path="url(#pitchClip)" opacity="0.18">
    <path d="M604 404H1136L1164 474H581L604 404Z" fill="#D8F0DE"/>
    <path d="M632 320H1103L1125 376H613L632 320Z" fill="#D8F0DE"/>
    <path d="M657 246H1074L1090 289H643L657 246Z" fill="#D8F0DE"/>
    <path d="M678 183H1048L1060 217H667L678 183Z" fill="#D8F0DE"/>
  </g>

  <path d="M685 142H1032L1170 492H568L685 142Z" class="pitch-line"/>
  <path d="M635 290H1090" class="pitch-line"/>
  <ellipse cx="862" cy="290" rx="68" ry="39" class="pitch-line"/>
  <circle cx="862" cy="290" r="3" fill="#F5FAF6" fill-opacity="0.8"/>
  <path d="M725 142L702 207H1060L1032 142" class="pitch-line"/>
  <path d="M601 397H1133L1170 492H568L601 397Z" class="pitch-line"/>
  <path d="M657 397L638 453H1104L1082 397" class="pitch-line"/>
  <path d="M839 397C789 417 775 439 778 453M900 397C952 417 968 439 967 453" class="pitch-line"/>

  <g opacity="0.94">
    <path d="M804 78H916L940 94H782L804 78Z" fill="url(#net)" stroke="#DCE8E0" stroke-opacity="0.42"/>
    <path d="M804 78V126L782 142V94L804 78Z" fill="url(#net)" stroke="#DCE8E0" stroke-opacity="0.34"/>
    <path d="M916 78V126L940 142V94L916 78Z" fill="url(#net)" stroke="#DCE8E0" stroke-opacity="0.34"/>
    <path d="M804 126H916L940 142H782L804 126Z" fill="url(#net)" stroke="#DCE8E0" stroke-opacity="0.34"/>
    <path d="M804 78H916V126H804V78Z" fill="url(#net)" opacity="0.7"/>
    <path d="M782 142V94H940V142" fill="none" stroke="#F4F7F5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M782 94L804 78H916L940 94M804 78V126M916 78V126M804 126H916" fill="none" stroke="#DDE7E1" stroke-width="2" stroke-opacity="0.82"/>
  </g>

  <path d="M982 426C963 372 918 260 860 142" class="route"/>

  <g>
    <animateMotion path="M0 0 C-20 -62 -66 -188 -122 -284" dur="5.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.72 0.34 1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.86;0.94;1" dur="5.2s" repeatCount="indefinite"/>
    <g transform="translate(982 439)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;0.32" dur="5.2s" repeatCount="indefinite"/>
        <ellipse rx="30" ry="8" fill="#021009" fill-opacity="0.58" filter="url(#ballShadow)"/>
      </g>
    </g>
  </g>
  <g>
    <animateMotion path="M0 0 C-20 -62 -66 -188 -122 -284" dur="5.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.72 0.34 1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.86;0.94;1" dur="5.2s" repeatCount="indefinite"/>
    <g transform="translate(982 419)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;0.32" dur="5.2s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-1080" dur="5.2s" repeatCount="indefinite"/>
        <circle r="27" fill="url(#ball)" stroke="#FFFFFF" stroke-opacity="0.72"/>
        <path d="M-5 -9L5 -15L15 -7L11 5L-2 8L-10 -1L-5 -9Z" fill="#17211B"/>
        <path d="M5 -15L8 -25M15 -7L25 -4M11 5L18 17M-2 8L-9 24M-10 -1L-24 -8" stroke="#38443D" stroke-width="2"/>
        <path d="M-18 -18L-11 -8M19 -17L13 -8M24 10L16 9M-18 17L-10 9" stroke="#78817C" stroke-width="1.5"/>
        <ellipse cx="-9" cy="-12" rx="7" ry="4" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-30 -9 -12)"/>
        </g>
      </g>
    </g>
  </g>

  <g class="sans">
    <g transform="translate(58 52)">
      <rect width="3" height="21" fill="#DCC47A"/>
      <text x="17" y="16" class="micro">01 / PLAYER PROFILE</text>
    </g>

    <text x="55" y="150" class="display" fill="#FFFFFF" font-size="62" font-weight="700">ADHVIK</text>
    <text x="55" y="208" class="display" fill="#FFFFFF" font-size="62" font-weight="700">RAYAPROLU</text>
    <path d="M58 231H489" stroke="#DCC47A" stroke-width="2"/>

    <text x="58" y="271" class="display" fill="#EAF0EC" font-size="20" font-weight="700">SOFTWARE ENGINEER / RESEARCHER</text>
    <text x="58" y="308" fill="#C6D1CB" font-size="16" font-weight="600">Mathematics + Computer Science at UIUC</text>
    <text x="58" y="337" fill="#9FB0A7" font-size="15" font-weight="500">Voice agents, full-stack products, and applied LLM research.</text>

    <g transform="translate(58 381)">
      <path d="M0 0H474M0 82H474M158 14V68M316 14V68" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="0" y="29" class="label">01  AI SYSTEMS</text>
      <text x="0" y="57" class="value">Voice + agents</text>
      <text x="176" y="29" class="label">02  PRODUCT</text>
      <text x="176" y="57" class="value">Full-stack apps</text>
      <text x="334" y="29" class="label">03  RESEARCH</text>
      <text x="334" y="57" class="value">LLMs + data</text>
    </g>

    <text x="58" y="503" fill="#91A59A" font-size="12" font-weight="600">PYTHON / FASTAPI / REACT / POSTGRESQL / RAG</text>
  </g>
</svg>
