<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu scouting report</title>
  <desc id="desc">A professional football scouting report with Adhvik's profile and technical attributes beside a three-dimensional pitch. Clickable players represent experience and selected work.</desc>
  <defs>
    <linearGradient id="stadium" x1="30" y1="18" x2="1164" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B16"/>
      <stop offset="0.52" stop-color="#0B1711"/>
      <stop offset="1" stop-color="#050D08"/>
    </linearGradient>
    <linearGradient id="pitch" x1="840" y1="112" x2="840" y2="554" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B8B5D"/>
      <stop offset="0.5" stop-color="#2F7045"/>
      <stop offset="1" stop-color="#195833"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F1D98B"/>
      <stop offset="1" stop-color="#C5A756"/>
    </linearGradient>
    <pattern id="grassGrain" width="17" height="17" patternUnits="userSpaceOnUse">
      <path d="M2 17L4 7M8 17L10 2M14 17L16 8" stroke="#D9F0DF" stroke-opacity="0.045"/>
      <path d="M5 14L3 4M12 17L13 7M16 13L15 2" stroke="#031B0C" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="net" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V10" stroke="#F4F7F5" stroke-opacity="0.46" stroke-width="0.8"/>
    </pattern>
    <clipPath id="pitchClip">
      <path d="M700 120H980L1170 545H510L700 120Z"/>
    </clipPath>
    <filter id="pitchShadow" x="-15%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="playerShadow" x="-80%" y="-60%" width="260%" height="260%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#041009" flood-opacity="0.58"/>
    </filter>
    <style>
      .body { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-stretch: condensed; }
      .pitch-line { fill: none; stroke: #F5F8F6; stroke-width: 2; stroke-opacity: 0.7; }
      .eyebrow { fill: #D2DDD7; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .label { fill: #93A69B; font-size: 12px; font-weight: 650; letter-spacing: 0; }
      .value { fill: #F5F7F6; font-size: 15px; font-weight: 700; letter-spacing: 0; }
      .player-number { font-family: "DIN Condensed", "Arial Narrow", sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .player-label { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #FFFFFF; font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 0; }
      .formation-line { fill: none; stroke: #F5F8F6; stroke-width: 1; stroke-opacity: 0.2; stroke-dasharray: 4 8; }
      .player-link { cursor: pointer; }
      .player-link:hover .player-label-bg, .player-link:focus .player-label-bg { fill: #234332; stroke-opacity: 1; }
      .player-link:hover .player-kit, .player-link:focus .player-kit { stroke-width: 2; }
    </style>
