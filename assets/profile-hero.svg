<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu profile pitch</title>
  <desc id="desc">A subtle Arsenal-inspired soccer tactics board introducing Adhvik Rayaprolu as a UIUC Math and Computer Science student building AI systems, full-stack products, and research tools.</desc>
  <defs>
    <linearGradient id="field" x1="90" y1="48" x2="1110" y2="632" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063672"/>
      <stop offset="0.58" stop-color="#0B2555"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF0107" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#DB0007" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#063672" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#030712" flood-opacity="0.26"/>
    </filter>
    <style>
