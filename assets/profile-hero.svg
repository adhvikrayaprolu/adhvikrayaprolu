<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu portfolio starting lineup</title>
  <desc id="desc">A horizontal football team sheet showing Adhvik's professional experience and selected repositories as a tactical lineup on a realistic green pitch with two goals.</desc>
  <defs>
    <linearGradient id="stadium" x1="24" y1="20" x2="1160" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B16"/>
      <stop offset="0.55" stop-color="#0B1711"/>
      <stop offset="1" stop-color="#06100B"/>
    </linearGradient>
    <linearGradient id="pitch" x1="570" y1="110" x2="1140" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#397B4D"/>
      <stop offset="0.48" stop-color="#2E7145"/>
      <stop offset="1" stop-color="#245F39"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F1D98B"/>
      <stop offset="1" stop-color="#C5A756"/>
    </linearGradient>
    <pattern id="grassGrain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 18L5 7M8 18L10 3M14 18L16 9" stroke="#D7F1DE" stroke-opacity="0.045" stroke-width="1"/>
      <path d="M5 15L3 5M12 18L13 8M17 14L16 2" stroke="#031B0C" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H10V10" stroke="#F4F7F5" stroke-opacity="0.5" stroke-width="0.8"/>
    </pattern>
    <filter id="pitchShadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="playerShadow" x="-80%" y="-60%" width="260%" height="260%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#041009" flood-opacity="0.55"/>
    </filter>
    <style>
      .body { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-stretch: condensed; }
      .pitch-line { fill: none; stroke: #F4F7F5; stroke-width: 2; stroke-opacity: 0.72; }
      .eyebrow { fill: #CFDAD4; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .small { fill: #98AAA0; font-size: 13px; font-weight: 600; letter-spacing: 0; }
      .player-number { font-family: "DIN Condensed", "Arial Narrow", sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .player-label { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #FFFFFF; font-size: 13px; font-weight: 700; text-anchor: middle; letter-spacing: 0; }
      .formation-line { fill: none; stroke: #F4F7F5; stroke-width: 1; stroke-opacity: 0.16; stroke-dasharray: 4 8; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#stadium)"/>
  <path d="M0 472C174 425 348 427 522 474C736 532 982 535 1200 475V600H0V472Z" fill="#030A06" fill-opacity="0.5"/>

  <g class="body">
    <rect x="52" y="48" width="3" height="22" fill="#DCC47A"/>
    <text x="69" y="65" class="eyebrow">PORTFOLIO LINEUP / 2026</text>

    <text x="51" y="145" class="display" fill="#FFFFFF" font-size="61" font-weight="700">ADHVIK</text>
    <text x="51" y="202" class="display" fill="#FFFFFF" font-size="61" font-weight="700">RAYAPROLU</text>
    <path d="M54 226H496" stroke="#DCC47A" stroke-width="2"/>

    <text x="54" y="270" class="display" fill="#F2F5F3" font-size="21" font-weight="700">SOFTWARE ENGINEER / RESEARCHER</text>
    <text x="54" y="307" fill="#C9D4CE" font-size="16" font-weight="600">Mathematics + Computer Science at UIUC</text>
    <text x="54" y="339" fill="#98AAA0" font-size="15" font-weight="500">Building AI systems, full-stack products,</text>
    <text x="54" y="362" fill="#98AAA0" font-size="15" font-weight="500">and research tools that ship.</text>

    <path d="M54 404H496" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="54" y="435" class="eyebrow">LINEUP KEY</text>

