    <path d="M54 225H472" stroke="#DCC47A" stroke-width="2"/>

    <text x="54" y="268" class="display" fill="#F2F5F3" font-size="21" font-weight="700">SOFTWARE ENGINEER / RESEARCHER</text>
    <text x="54" y="305" fill="#CBD6D0" font-size="16" font-weight="600">Mathematics + Computer Science at UIUC</text>
    <text x="54" y="337" fill="#98AAA0" font-size="15" font-weight="500">I build intelligent systems that move from</text>
    <text x="54" y="360" fill="#98AAA0" font-size="15" font-weight="500">research prototypes to reliable products.</text>

    <text x="54" y="403" class="eyebrow">PLAYER ATTRIBUTES</text>
    <path d="M54 418H472M54 495H472M263 418V495" stroke="#FFFFFF" stroke-opacity="0.17"/>

    <text x="54" y="443" class="label">AI SYSTEMS</text>
    <text x="54" y="470" class="value">Agents + RAG</text>
    <text x="283" y="443" class="label">BACKEND</text>
    <text x="283" y="470" class="value">APIs + data</text>

    <path d="M54 512H472M54 589H472M263 512V589" stroke="#FFFFFF" stroke-opacity="0.17"/>
    <text x="54" y="537" class="label">PRODUCT</text>
    <text x="54" y="564" class="value">Full-stack apps</text>
    <text x="283" y="537" class="label">RESEARCH</text>
    <text x="283" y="564" class="value">LLMs + analytics</text>

    <text x="54" y="615" fill="#86998E" font-size="12" font-weight="600">PYTHON / FASTAPI / REACT / POSTGRESQL</text>
  </g>

  <text x="540" y="58" class="display" fill="#F3F6F4" font-size="24" font-weight="700">2 - 3 - 2 / SELECTED LINEUP</text>
  <text x="1150" y="56" class="body label" text-anchor="end">CLICK A PLAYER FOR PROOF</text>

