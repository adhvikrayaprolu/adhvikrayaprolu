  <rect width="1200" height="640" rx="24" fill="url(#stadium)"/>
  <path d="M0 508C176 461 339 463 500 505C725 564 956 572 1200 514V640H0V508Z" fill="#020805" fill-opacity="0.48"/>
  <path d="M545 84L683 84L525 560H452L545 84Z" fill="#FFFFFF" fill-opacity="0.018"/>
  <path d="M1090 65L1170 65L1200 255V456L1090 65Z" fill="#FFFFFF" fill-opacity="0.024"/>

  <g class="body">
    <rect x="52" y="47" width="3" height="22" fill="#DCC47A"/>
    <text x="69" y="64" class="eyebrow">SCOUTING REPORT / 2026</text>

    <a href="https://github.com/adhvikrayaprolu" target="_top" aria-label="Open Adhvik Rayaprolu's GitHub profile">
      <text x="51" y="143" class="display" fill="#FFFFFF" font-size="61" font-weight="700">ADHVIK</text>
      <text x="51" y="200" class="display" fill="#FFFFFF" font-size="61" font-weight="700">RAYAPROLU</text>
