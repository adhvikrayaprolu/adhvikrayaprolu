<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu profile banner</title>
  <desc id="desc">A red, dark red, and blue landing banner introducing Adhvik Rayaprolu as a full-stack builder and AI product explorer.</desc>
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF0107"/>
      <stop offset="0.48" stop-color="#DB0007"/>
      <stop offset="1" stop-color="#063672"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="120" y1="316" x2="1080" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#120004" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#063672"/>
  <path d="M0 0H1200V420H0V0Z" fill="url(#heroGradient)"/>
  <path d="M0 0H1200L968 420H0V0Z" fill="#EF0107" opacity="0.55"/>
  <path d="M1200 0V420H616L892 0H1200Z" fill="#063672" opacity="0.82"/>
  <path d="M64 58H1136V362H64V58Z" fill="#0B1020" opacity="0.16"/>
  <path d="M92 86H1108V334H92V86Z" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2"/>
  <text x="950" y="264" text-anchor="middle" fill="#FFFFFF" opacity="0.12" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="190" font-weight="900">AR</text>
  <g filter="url(#softShadow)">
    <text x="140" y="142" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">FULL-STACK BUILDER</text>
    <text x="140" y="218" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800">ADHVIK RAYAPROLU</text>
    <text x="140" y="276" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600">AI products, useful systems, social good</text>
  </g>
  <path d="M120 316H760" stroke="url(#lineGradient)" stroke-width="3"/>
  <g fill="#FFFFFF" opacity="0.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">
    <text x="142" y="350">TYPESCRIPT</text>
    <text x="314" y="350">PYTHON</text>
    <text x="438" y="350">JAVA</text>
    <text x="536" y="350">OPENAI API</text>
  </g>
</svg>
