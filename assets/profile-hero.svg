<svg width="900" height="1500" viewBox="0 0 900 1500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adhvik Rayaprolu football-themed profile pitch</title>
  <desc id="desc">A vertical green football pitch with Arsenal-inspired red, white, and navy accents. It presents Adhvik Rayaprolu's education, experience, research, projects, toolkit, and contact links as a professional lineup card.</desc>
  <defs>
    <linearGradient id="grass" x1="120" y1="140" x2="780" y2="1320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#176B3A"/>
      <stop offset="0.5" stop-color="#0F5A31"/>
      <stop offset="1" stop-color="#0B4228"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#03120B" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pitch { stroke: #FFFFFF; stroke-opacity: 0.68; stroke-width: 3; }
      .pitchThin { stroke: #FFFFFF; stroke-opacity: 0.26; stroke-width: 1.5; }
      .route { stroke: #FFFFFF; stroke-opacity: 0.38; stroke-width: 2.5; stroke-dasharray: 10 12; }
      .panel { fill: #063672; fill-opacity: 0.92; stroke: url(#cardStroke); stroke-width: 1.5; }
      .redPanel { fill: #DB0007; fill-opacity: 0.92; stroke: #FFFFFF; stroke-opacity: 0.28; stroke-width: 1.5; }
      .tag { fill: #EF0107; }
      .micro { fill: #DCE8F7; font-size: 15px; font-weight: 800; letter-spacing: 0; }
      .titleText { fill: #FFFFFF; font-size: 40px; font-weight: 900; letter-spacing: 0; }
      .cardTitle { fill: #FFFFFF; font-size: 26px; font-weight: 900; letter-spacing: 0; }
      .cardBody { fill: #F8FAFC; font-size: 18px; font-weight: 650; letter-spacing: 0; }
      .small { fill: #E7F0FA; font-size: 16px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="900" height="1500" fill="#F6F7F9"/>
  <rect x="58" y="42" width="784" height="1416" rx="40" fill="#EF0107"/>
  <rect x="86" y="70" width="728" height="1360" rx="28" fill="#063672"/>
  <rect x="112" y="112" width="676" height="1276" rx="18" fill="url(#grass)"/>

  <g opacity="0.72">
    <rect x="112" y="112" width="84" height="1276" fill="url(#stripe)"/>
    <rect x="280" y="112" width="84" height="1276" fill="url(#stripe)"/>
    <rect x="448" y="112" width="84" height="1276" fill="url(#stripe)"/>
    <rect x="616" y="112" width="84" height="1276" fill="url(#stripe)"/>
  </g>

  <rect x="144" y="152" width="612" height="1196" rx="12" class="pitch"/>
  <path d="M144 750H756" class="pitch"/>
  <circle cx="450" cy="750" r="96" class="pitch"/>
  <circle cx="450" cy="750" r="7" fill="#FFFFFF" opacity="0.8"/>

  <rect x="284" y="152" width="332" height="150" class="pitch"/>
  <rect x="354" y="152" width="192" height="70" class="pitch"/>
  <path d="M354 302C386 330 514 330 546 302" class="pitch"/>
  <rect x="284" y="1198" width="332" height="150" class="pitch"/>
  <rect x="354" y="1278" width="192" height="70" class="pitch"/>
  <path d="M354 1198C386 1170 514 1170 546 1198" class="pitch"/>

  <path d="M210 430H690" class="pitchThin"/>
  <path d="M210 1040H690" class="pitchThin"/>
  <path d="M450 322V552" class="route"/>
  <path d="M320 568C366 620 406 672 430 732" class="route"/>
  <path d="M580 568C534 620 494 672 470 732" class="route"/>
  <path d="M450 852V1082" class="route"/>

  <g filter="url(#shadow)">
    <rect x="184" y="202" width="532" height="178" rx="18" class="redPanel"/>
    <text x="450" y="242" text-anchor="middle" class="sans micro">MATCHDAY PROFILE</text>
    <text x="450" y="298" text-anchor="middle" class="sans titleText">ADHVIK RAYAPROLU</text>
    <text x="450" y="340" text-anchor="middle" class="sans cardBody">Math + CS @ UIUC</text>
    <text x="450" y="365" text-anchor="middle" class="sans small">AI systems | full-stack products | research tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="242" y="458" width="416" height="118" rx="16" class="panel"/>
    <circle cx="274" cy="494" r="13" class="tag"/>
    <text x="304" y="500" class="sans micro">MIDFIELD ENGINE</text>
    <text x="274" y="536" class="sans cardTitle">UIUC Math + CS</text>
    <text x="274" y="562" class="sans cardBody">B.S. candidate, Dean's List</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="142" y="628" width="286" height="128" rx="16" class="panel"/>
    <circle cx="174" cy="666" r="13" class="tag"/>
    <text x="204" y="672" class="sans micro">FORWARD</text>
    <text x="174" y="708" class="sans cardTitle">Gnani.ai</text>
    <text x="174" y="734" class="sans cardBody">Voice + chat agents</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="628" width="286" height="128" rx="16" class="panel"/>
    <circle cx="504" cy="666" r="13" class="tag"/>
    <text x="534" y="672" class="sans micro">PLAYMAKER</text>
    <text x="504" y="708" class="sans cardTitle">Zapp</text>
    <text x="504" y="734" class="sans cardBody">Spending intelligence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="142" y="820" width="286" height="128" rx="16" class="panel"/>
    <circle cx="174" cy="858" r="13" class="tag"/>
    <text x="204" y="864" class="sans micro">ANALYST</text>
    <text x="174" y="900" class="sans cardTitle">NCSA + IML</text>
    <text x="174" y="926" class="sans cardBody">LLMs, RAG, sports data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="820" width="286" height="128" rx="16" class="panel"/>
    <circle cx="504" cy="858" r="13" class="tag"/>
    <text x="534" y="864" class="sans micro">FULLBACK</text>
    <text x="504" y="900" class="sans cardTitle">ClayHR</text>
    <text x="504" y="926" class="sans cardBody">Chatbot + apps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="184" y="1084" width="532" height="136" rx="18" class="redPanel"/>
    <text x="450" y="1126" text-anchor="middle" class="sans micro">TECHNICAL KIT</text>
    <text x="450" y="1172" text-anchor="middle" class="sans cardBody">Python | FastAPI | React | Django | OpenAI API</text>
    <text x="450" y="1200" text-anchor="middle" class="sans small">PostgreSQL | Supabase | Firebase | RAG | MCP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="242" y="1254" width="416" height="78" rx="16" class="panel"/>
    <text x="450" y="1287" text-anchor="middle" class="sans micro">FINAL WHISTLE</text>
    <text x="450" y="1318" text-anchor="middle" class="sans cardBody">github.com/adhvikrayaprolu</text>
  </g>
</svg>
